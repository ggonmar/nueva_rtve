name: Actualizar parrilla

on:
  push:
    branches: [main]
    paths:
      - 'programas/**'
      - 'readme.md'
      - 'scripts/actualizar_parrilla.py'
      - 'tests/**'
      - '.github/workflows/actualizar-parrilla.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-parrilla-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Comprobar el generador
        run: python3 -m unittest discover -s tests
      - name: Generar tablas
        run: python3 scripts/actualizar_parrilla.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar parrilla de programas"
            git push origin HEAD:main
          fi

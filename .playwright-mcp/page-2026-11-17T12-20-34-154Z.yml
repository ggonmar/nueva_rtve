          - heading "Óscar Puente se imputa a sí mismo en X para llegar, por una vez, antes que alguien" [level=1] [ref=f4e252]
          - paragraph [ref=f4e253]: El ministro publica un hilo de 112 mensajes en el que se acusa, se defiende, se absuelve y, finalmente, culpa a Feijóo de haberle obligado a escribirlo.
          - generic [ref=f4e254]:
            - paragraph [ref=f4e255]: VALLADOLID, (FACHATEXTO). En un movimiento inédito en la política española, el ministro de Transportes, Óscar Puente, ha anunciado en redes sociales su autoimputación «en un ejercicio de transparencia y de puntualidad que no siempre se ve en el ferrocarril».
            - paragraph [ref=f4e256]: «Si alguien va a llegar tarde a este asunto, que sea el tren», ha escrito el ministro, que ha adjuntado una captura del Código Penal con varios artículos subrayados y un emoticono de una cara guiñando el ojo.
            - heading "La Fiscalía, sin nadie disponible para firmar" [level=3] [ref=f4e257]
            - paragraph [ref=f4e258]: Fuentes judiciales confirman que la autoimputación carece de validez legal, pero reconocen que «es la primera vez en esta legislatura que alguien del Gobierno se adelanta a un juez». En la Fiscalía han tratado de responder por escrito, aunque la tarea se ha retrasado mientras se buscaba a algún cargo que no estuviera, a su vez, pendiente de sentencia.
            - paragraph [ref=f4e259]: "El hilo termina con una encuesta: «¿Quién tiene la culpa de todo? A) Aznar B) Ayuso C) Los fachas D) Todas son correctas». Con el 98 % de los votos, gana la opción E, que no existía."
          - paragraph [ref=f4e260]: Redacción de Tribunales (sección cada vez más grande)
          - paragraph [ref=f4e261]: Noticia satírica. Cualquier parecido con la realidad es culpa de la realidad.
